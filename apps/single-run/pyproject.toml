[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mironova-single-run"
version = "0.6.3"
description = "Local single-injection integrated UV and mass spectrometry report"
requires-python = ">=3.12,<3.13"
dependencies = ["altair==6.3.0", "pandas==2.2.3", "numpy==2.3.5", "scipy==1.18.1", "rainbow-api==1.5.5", "reportlab==4.4.9", "matplotlib==3.11.2", "streamlit==1.67.0", "pypdf==6.10.0"]

[tool.setuptools.packages.find]
include = ["hplc_autoquant*"]
